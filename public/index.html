<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#245edb" />
    <meta name="description" content="Developer Portfolio - Windows XP Style Interactive Desktop Experience" />
    <meta name="author" content="Your Name" />
    
    <!-- Prevent iOS zoom on input focus -->
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Favicon - You can replace with your own -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪟</text></svg>" />
    
    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="Your Name - Developer Portfolio" />
    <meta property="og:description" content="Interactive Windows XP style developer portfolio" />
    <meta property="og:type" content="website" />
    
    <title>Your Name | Developer Portfolio</title>
    
    <style>
      /* Critical CSS for initial load */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      html, body, #root {
        height: 100%;
        width: 100%;
        overflow: hidden;
      }
      
      body {
        font-family: 'Tahoma', 'Segoe UI', sans-serif;
        background: #245edb;
      }
      
      /* Loading screen */
      .loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: #000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #fff;
        z-index: 99999;
      }
      
      .loading-logo {
        font-size: 48px;
        margin-bottom: 20px;
        animation: pulse 1.5s infinite;
      }
      
      .loading-text {
        font-size: 14px;
        color: #aaa;
      }
      
      .loading-bar {
        width: 200px;
        height: 20px;
        background: #333;
        border-radius: 10px;
        margin-top: 20px;
        overflow: hidden;
      }
      
      .loading-progress {
        height: 100%;
        background: linear-gradient(90deg, #3c943c, #5cb85c);
        animation: loading 2s ease-in-out infinite;
      }
      
      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.1); }
      }
      
      @keyframes loading {
        0% { width: 0%; }
        50% { width: 70%; }
        100% { width: 100%; }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this portfolio.</noscript>
    
    <!-- Loading screen (will be replaced by React) -->
    <div id="root">
      <div class="loading-screen">
        <div class="loading-logo">🪟</div>
        <div class="loading-text">Loading Windows XP Portfolio...</div>
        <div class="loading-bar">
          <div class="loading-progress"></div>
        </div>
      </div>
    </div>
  </body>
</html>
